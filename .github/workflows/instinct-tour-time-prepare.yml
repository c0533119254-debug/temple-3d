name: Prepare station-local tour time fix
on:
  push:
    branches: [instinct/tour-time-jumps-20261122]
    paths: [.github/workflows/instinct-tour-time-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed patch and rebuild generated index
        run: |
          python3 - <<'PYCODE'
          import base64,subprocess
          subprocess.run(['git','apply','--check','-'],input=base64.b64decode(''),check=True)
          subprocess.run(['git','apply','-'],input=base64.b64decode(''),check=True)
          PYCODE
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          node tools/test/tour-time-jumps.js
          rm .github/workflows/instinct-tour-time-prepare.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/62-tours-ui.js index.html tools/test/tour-time-jumps.js tools/test/usage-matrix.js .github/workflows/instinct-tour-time-prepare.yml
          git diff --cached --check
          git commit -m 'Make Tamid and Yom Kippur station time independent of navigation order'
          git push origin HEAD:instinct/tour-time-jumps-20261122

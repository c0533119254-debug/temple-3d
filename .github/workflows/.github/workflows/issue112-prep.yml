name: Prepare issue112 topic remap
on:
  push:
    paths: ['.github/workflows/issue112-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow topic binding and rebuild
        env:
          PATCH_SCRIPT: 
        run: |
          printf '%s' "$PATCH_SCRIPT" | base64 -d > /tmp/fix112.py
          python3 /tmp/fix112.py
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          node --check music-module/music.js
          rm .github/workflows/issue112-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/main/32-story-tours.js src/main/62-tours-ui.js music-module/music.js .github/workflows/issue112-prep.yml
          git commit -m 'Bind Tamid figure, camera and music plans to station topics'
          git push

name: Prepare Pesach source citation fix
on:
  push:
    branches: ['instinct/pesach-source-card-20261122']
    paths: ['.github/workflows/prep-pesach-source.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified citation-only patch and rebuild
        env:
          PATCH: 
        run: |
          printf '%s' "$PATCH" | base64 -d > /tmp/pesach.patch
          git apply /tmp/pesach.patch
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          rm .github/workflows/prep-pesach-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/62-tours-ui.js tours/reading.json index.html .github/workflows/prep-pesach-source.yml
          git commit -m 'Fix Pesach priest-row full source citation to Mishnah 5:5'
          git push

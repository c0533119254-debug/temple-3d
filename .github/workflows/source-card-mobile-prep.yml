name: Prepare tour source card mobile close fix
on:
  push:
    paths: ['.github/workflows/source-card-mobile-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile source card inset and rebuild
        env:
          PATCH: 
        run: |
          printf '%s' "$PATCH" | base64 -d > /tmp/mobile.patch
          git apply /tmp/mobile.patch
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          rm .github/workflows/source-card-mobile-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/page/10-page-top.html .github/workflows/source-card-mobile-prep.yml
          git commit -m 'Keep mobile tour source close button below search bar'
          git push

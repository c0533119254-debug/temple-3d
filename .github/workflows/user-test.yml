# בדיקה אוטומטית בכל PR: src/ ו-index.html תואמים, ובדיקת משתמש במחשב ובטלפון.
# זה לא מפרסם כלום. הפרסום נשאר ב-pages.yml, רק אחרי מיזוג ל-main.
name: בדיקת משתמש

on:
  pull_request:
    paths: ["index.html", "src/**", "tools/**", "music-module/**", "layer/**", ".github/workflows/user-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: src/ ו-index.html זהים
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/templesrc.py check

  user-path:
    name: מסלול משתמש (מחשב וטלפון)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: התקנת דפדפן לבדיקה
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: הרצת האתר ובדיקה
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/user-path.js http://localhost:8765/ user-test-out
      - name: דוח
        if: always()
        run: cat user-test-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: צילומי מסך
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-test-screens
          path: user-test-out
          retention-days: 14

  # 125.7: מסלולי העיר והסדרה הרחבה רצים במקביל, כדי שהבדיקה כולה לא תתארך
  city-walks:
    name: מסלולי ההליכה בעיר
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: התקנת דפדפן לבדיקה
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: מסלולי ההליכה (יעד גלוי, הליכה בפקדים, קיר חוסם)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/city-walks.js http://localhost:8765/ city-out
      - name: דוח
        if: always()
        run: cat city-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: צילומי מסך
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-walk-screens
          path: city-out
          retention-days: 14

  usage-matrix:
    name: סדרת שימוש רחבה (חגים, סיורים, חיפושים, מסכים)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: התקנת דפדפן לבדיקה
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: הסדרה
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/usage-matrix.js http://localhost:8765/ matrix-out
      - name: דוח
        if: always()
        run: cat matrix-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: צילומי מסך
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-matrix-screens
          path: matrix-out
          retention-days: 14

  shoeva:
    name: שמחת בית השואבה נטענת
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: התקנת דפדפן לבדיקה
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: הסצנה
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/shoeva-scene.js http://localhost:8765/ shoeva-out
      - name: דוח
        if: always()
        run: cat shoeva-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: צילומי מסך
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shoeva-screens
          path: shoeva-out
          retention-days: 14

  perf:
    name: תקציב ציור (משולשים וקריאות)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: התקנת דפדפן לבדיקה
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: שלושה מבטים במחשב ובטלפון
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/perf-probe.js http://localhost:8765/ perf-out
      - name: דוח
        if: always()
        run: cat perf-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: צילומי מסך
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-screens
          path: perf-out
          retention-days: 14

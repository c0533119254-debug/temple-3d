name: Build Shavuot source-note corrections
on:
  push:
    branches: [instinct/shavuot-sources-20261119]
    paths: [.github/workflows/shavuot-sources.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          SHAVUOT_CARDS: "{\n  \"old\": \"        const NV=\\\"ציטוט המשנה לא נבדק מול נוסח נקי. \\\";\\n        const SC={\\n          proc:I(\\\"מצעד הביכורים\\\",\\\"ביכורים ג, ג-ד\\\",\\\"📜 מביאי הביכורים עולים מן העיר אל הר הבית בתהלוכה: שור הולך לפניהם, קרניו מצופות זהב ועטרה של זית בראשו, והחליל מכה לפניהם. מוצג בו׳ בסיוון ובימי התשלומין. 💡 מסלול הצעידה בעיר ומספר ההולכים הם הצעה לתצוגה. 💡 הכניסה בשער הצפוני היא הצעה: יחזקאל מו, ט מורה שהבא בשער צפון יוצא בשער נגב. \\\"+NV+\\\"במודל הכול נעשה לפי ההר של יחזקאל, והמצעד מגיע אל «השער החיצון הצפוני».\\\"),\\n          ox:I(\\\"השור והחליל\\\",\\\"ביכורים ג, ג\\\",\\\"📜 שור הולך לפני מביאי הביכורים. קרניו מצופות זהב ועטרה של זית בראשו, והחליל מכה לפניהם. \\\"+NV+\\\"💡 גודל השור וצורת החליל הם הצעה לתצוגה.\\\"),\\n          meet:I(\\\"בעלי אומניות ופקידי העיר\\\",\\\"ביכורים ג, ג; רמב״ם, הלכות ביכורים ד, יז\\\",\\\"📜 בעלי האומניות שבירושלים עומדים לפניהם בשולי הרחוב, והפחות, הסגנים והגזברים יוצאים לקראתם. מוצג ברחובות העיר ליד הכניסה. \\\"+NV+\\\"לא נבדק גם נוסח הרמב״ם. 💡 מספר העומדים, מקומם ולבושם הם הצעה לתצוגה.\\\"),\\n          bask:I(\\\"סלי הביכורים\\\",\\\"ביכורים ג, ח; ג, ה\\\",\\\"📜 העשירים מביאים את ביכוריהם בקלתות של כסף ושל זהב, והעניים בסלי נצרים של ערבה קלופה. התורים והיונים על גבי הסלים. \\\"+NV+\\\"💡 היחס בין העשירים והעניים, כאן אחד מששה, הוא הצעה לתצוגה.\\\"),\\n          shoulder:I(\\\"הסל על הכתף\\\",\\\"ביכורים ג, ד\\\",\\\"📜 משמגיעים להר הבית, כל אחד נוטל את סלו על כתפו ונכנס. ביחזקאל ההר והחצר החיצונה הם אותו מקום (מ, יז-יט). \\\"+NV+\\\"💡 קצב ההליכה ומספר ההולכים הם הצעה לתצוגה.\\\"),\\n          lev:I(\\\"הלוויים שרים\\\",\\\"ביכורים ג, ד; תהלים ל, ב\\\",\\\"📜 הלוויים שרים: \\\\\\\"ארוממך ה׳ כי דליתני ולא שמחת אויבי לי\\\\\\\" (תהלים ל, ב). במודל הלוויים עומדים על מעלות השער הפנימי המזרחי. 💡 מספר הלוויים ומקומם הם הצעה לתצוגה. אין כאן קול.\\\"),\\n          pile:I(\\\"סלי הביכורים ליד המזבח\\\",\\\"ביכורים ג, ו\\\",\\\"📜 הכוהן נוטל את הסל מיד המביא, מניפו, ומניחו בצד המזבח. כאן נערמים הסלים בצד הצפוני של המזבח. \\\"+NV+\\\"💡 מספר הסלים וצורת הערימה הם הצעה לתצוגה.\\\"),\\n          shtei:I(\\\"שתי הלחם: תנופה\\\",\\\"מנחות יא, ד; ה, ו; רמב״ם, הלכות תמידין ומוספין ח, ז-יא\\\",\\\"📜 שתי הלחם חמץ. \\\\\\\"שתי הלחם אורכן שבעה, ורוחבן ארבעה, וקרנותיה ארבע אצבעות\\\\\\\" (מנחות יא, ד). ⚖️ בלשון הרמב״ם: אורך כל חלה שבעה טפחים, רוחבה ארבעה טפחים, וגובהה ארבע אצבעות (ח, י). 📜 הכוהן נותן אותן על שני כבשים, מניח שתי ידיו מלמטה, \\\\\\\"מוליך ומביא, מעלה ומוריד\\\\\\\" (מנחות ה, ו). ⚖️ הרמב״ם: \\\\\\\"מביא שני הכבשים, ומניף אותם כשהם חיים\\\\\\\" (ח, יא). הרמב״ם מתאר תנופה בשני שלבים: הכבשים חיים, ואחר השחיטה השתי הלחם עם החזה והשוק; במשנה השתי הלחם נתונות על הכבשים. המודל מציג את נוסח המשנה. מוצג בו׳ בסיוון, במזרח החצר הפנימית לפני המזבח. 💡 מקום התנופה לפי הטבלה של המשימה, ונוסח «במזרח» לא נבדק מול נוסח נקי. 💡 צבע הלחם ומספר הכוהנים הם הצעה.\\\"),\\n          bake:I(\\\"אפיית שתי הלחם\\\",\\\"רמב״ם, הלכות תמידין ומוספין ח, ח-ט\\\",\\\"⚖️ הרמב״ם: אין עשייתן דוחה יום טוב, \\\\\\\"אלא אופין אותן מערב יום טוב\\\\\\\". לכן בערב שבועות אופים את שתי הלחם. 💡 מקום האפייה, התנור והכוהנים הם הצעה לתצוגה, בלי מקור.\\\"),\\n          crowd:I(\\\"הקהל בחצר החיצונה\\\",\\\"יחזקאל מו, ט\\\",\\\"📜 העם בא \\\\\\\"לפני ה׳ במועדים\\\\\\\" ועומד בחצר החיצונה. 💡 הצפיפות, 1.2 איש למ״ר, היא ערך תצוגה ולא נתון בטיחות, וכאן מוצגות פחות דמויות, לפי תקציב הדמויות. הרחוקים מן המצלמה מצוירים בצורה פשוטה. בימי התשלומין הקהל פוחת אט אט: 💡 הערכים הם הצעה.\\\"),\\n          flow:I(\\\"זרם הקהל במועד\\\",\\\"יחזקאל מו, ט; מלבי״ם מו, ט-י\\\",\\\"📜 \\\\\\\"הבא דרך שער צפון להשתחות יצא דרך שער נגב... לא ישוב דרך השער אשר בא בו\\\\\\\". ⚖️ המלבי״ם: כך נעשה \\\\\\\"לכבוד העם\\\\\\\". במודל שני זרמים, מצפון לדרום ומדרום לצפון. השער המזרחי סגור. 💡 מסלול ההליכה ומספר ההולכים הם הצעה לתצוגה.\\\"),\\n          sleep:I(\\\"עיר המעמד: לנים ברחוב\\\",\\\"ביכורים ג, ב\\\",\\\"📜 מביאי הביכורים מתכנסים לעיר המעמד, לנים ברחובה של עיר, והממונה אומר להם: קומו ונעלה ציון אל בית ה׳ אלהינו. \\\"+NV+\\\"💡 מקום עיר המעמד, מספר הישנים והממונה הם הצעה לתצוגה.\\\"),\\n          green:I(\\\"ירק ופרחים בשערים החיצוניים\\\",\\\"💡 הצעה, ללא מקור\\\",\\\"💡 הצעה, ללא מקור. עיטור ירק ופרחים מוצג רק בשערים החיצוניים של החצר החיצונה, ולא על המזבח ולא בהיכל. מוצג בערב שבועות, בו׳ בסיוון ובימי התשלומין.\\\"),\\n          olim:I(\\\"עולות ראייה בחצר הפנימית\\\",\\\"חגיגה א, א; חגיגה יז ע״א; רמב״ם, הלכות חגיגה א, ז\\\",\\\"📜 עולות הראייה ושלמי החגיגה מוקרבים ברגל, וימי התשלומין נמשכים שבעה ימים לשבועות. הציטוט המדויק של הרמב״ם (חגיגה א, ז) והדף בגמרא לא נבדקו מול נוסח נקי. מוצג בו׳ בסיוון ובימי התשלומין. 💡 מספר המביאים ומקומם הם הצעה לתצוגה.\\\"),\\n          cook:I(\\\"שלמי החגיגה בבית המבשלים\\\",\\\"יחזקאל מו, כא-כד; מלבי״ם מו, כד; חגיגה יז ע״א\\\",\\\"📜 \\\\\\\"יבשלו שם משרתי הבית את זבח העם\\\\\\\" (יחזקאל מו, כד). ⚖️ המלבי״ם: מבשלים שם שלמים ותודה. בימי התשלומין ממשיכים להביא שלמי חגיגה. 💡 מספר המשרתים והסירים הוא הצעה לתצוגה.\\\")};\\n\",\n  \"new\": \"        const NV=\\\"\\\";\\n        const SC={\\n          proc:I(\\\"מצעד הביכורים\\\",\\\"ביכורים ג, ג-ד\\\",\\\"📜 מביאי הביכורים עולים מן העיר אל הר הבית בתהלוכה: שור הולך לפניהם, קרניו מצופות זהב ועטרה של זית בראשו, והחליל מכה לפניהם. מוצג בו׳ בסיוון ובימי התשלומין. 💡 מסלול הצעידה בעיר ומספר ההולכים הם הצעה לתצוגה. 💡 הכניסה בשער הצפוני היא הצעה: יחזקאל מו, ט מורה שהבא בשער צפון יוצא בשער נגב. \\\"+NV+\\\"במודל הכול נעשה לפי ההר של יחזקאל, והמצעד מגיע אל «השער החיצון הצפוני».\\\"),\\n          ox:I(\\\"השור והחליל\\\",\\\"ביכורים ג, ג\\\",\\\"📜 שור הולך לפני מביאי הביכורים. קרניו מצופות זהב ועטרה של זית בראשו, והחליל מכה לפניהם. \\\"+NV+\\\"💡 גודל השור וצורת החליל הם הצעה לתצוגה.\\\"),\\n          meet:I(\\\"בעלי אומניות ופקידי העיר\\\",\\\"ביכורים ג, ג; רמב״ם, הלכות ביכורים ד, טז–יז\\\",\\\"📜 בעלי האומניות שבירושלים עומדים לפניהם בשולי הרחוב, והפחות, הסגנים והגזברים יוצאים לקראתם. מוצג ברחובות העיר ליד הכניסה. \\\"+NV+\\\"💡 מספר העומדים, מקומם ולבושם הם הצעה לתצוגה.\\\"),\\n          bask:I(\\\"סלי הביכורים\\\",\\\"ביכורים ג, ח; ג, ה\\\",\\\"📜 העשירים מביאים את ביכוריהם בקלתות של כסף ושל זהב, והעניים בסלי נצרים של ערבה קלופה. התורים והיונים על גבי הסלים. \\\"+NV+\\\"💡 היחס בין העשירים והעניים, כאן אחד מששה, הוא הצעה לתצוגה.\\\"),\\n          shoulder:I(\\\"הסל על הכתף\\\",\\\"ביכורים ג, ד\\\",\\\"📜 משמגיעים להר הבית, כל אחד נוטל את סלו על כתפו ונכנס. ביחזקאל ההר והחצר החיצונה הם אותו מקום (מ, יז-יט). \\\"+NV+\\\"💡 קצב ההליכה ומספר ההולכים הם הצעה לתצוגה.\\\"),\\n          lev:I(\\\"הלוויים שרים\\\",\\\"ביכורים ג, ד; תהלים ל, ב\\\",\\\"📜 הלוויים שרים: \\\\\\\"ארוממך ה׳ כי דליתני ולא שמחת אויבי לי\\\\\\\" (תהלים ל, ב). במודל הלוויים עומדים על מעלות השער הפנימי המזרחי. 💡 מספר הלוויים ומקומם הם הצעה לתצוגה. אין כאן קול.\\\"),\\n          pile:I(\\\"סלי הביכורים ליד המזבח\\\",\\\"ביכורים ג, ו; רמב״ם, הלכות ביכורים ג, יב\\\",\\\"📜 הכוהן נוטל את הסל מיד המביא, מניפו, ומניחו בצד המזבח. ⚖️ רמב״ם, הלכות ביכורים ג, יב: «בקרן דרומית מערבית בדרומה של קרן». 💡 כאן נערמים הסלים בצד הצפוני של המזבח, בניגוד למיקום המתואר ברמב״ם; הגאומטריה לא שונתה בבדיקת המקורות. \\\"+NV+\\\"💡 מספר הסלים וצורת הערימה הם הצעה לתצוגה.\\\"),\\n          shtei:I(\\\"שתי הלחם: תנופה\\\",\\\"מנחות יא, ד; ה, ו; רמב״ם, הלכות תמידין ומוספין ח, ז-יא\\\",\\\"📜 שתי הלחם חמץ. \\\\\\\"שתי הלחם אורכן שבעה, ורוחבן ארבעה, וקרנותיה ארבע אצבעות\\\\\\\" (מנחות יא, ד). ⚖️ בלשון הרמב״ם: אורך כל חלה שבעה טפחים, רוחבה ארבעה טפחים, וגובהה ארבע אצבעות (ח, י). 📜 הכוהן נותן אותן על שני כבשים, מניח שתי ידיו מלמטה, \\\\\\\"מוליך ומביא, מעלה ומוריד\\\\\\\" (מנחות ה, ו). ⚖️ הרמב״ם: \\\\\\\"מביא שני הכבשים, ומניף אותם כשהם חיים\\\\\\\" (ח, יא). הרמב״ם מתאר תנופה בשני שלבים: הכבשים חיים, ואחר השחיטה השתי הלחם עם החזה והשוק; במשנה השתי הלחם נתונות על הכבשים. המודל מציג את נוסח המשנה. מוצג בו׳ בסיוון, במזרח החצר הפנימית לפני המזבח. 📜 «תנופה היתה במזרח» מפורש במשנה מנחות ה, ו; וכן ברמב״ם ח, יא: «ומניף הכל כאחד במזרח במקום כל התנופות». אין בכך בדיקה של מידת הדיוק בגאומטריה. 💡 צבע הלחם ומספר הכוהנים הם הצעה.\\\"),\\n          bake:I(\\\"אפיית שתי הלחם\\\",\\\"רמב״ם, הלכות תמידין ומוספין ח, ח-ט\\\",\\\"⚖️ הרמב״ם: אין עשייתן דוחה יום טוב, \\\\\\\"אלא אופין אותן מערב יום טוב\\\\\\\". לכן בערב שבועות אופים את שתי הלחם. 💡 מקום האפייה, התנור והכוהנים הם הצעה לתצוגה, בלי מקור.\\\"),\\n          crowd:I(\\\"הקהל בחצר החיצונה\\\",\\\"יחזקאל מו, ט\\\",\\\"📜 העם בא \\\\\\\"לפני ה׳ במועדים\\\\\\\" ועומד בחצר החיצונה. 💡 הצפיפות, 1.2 איש למ״ר, היא ערך תצוגה ולא נתון בטיחות, וכאן מוצגות פחות דמויות, לפי תקציב הדמויות. הרחוקים מן המצלמה מצוירים בצורה פשוטה. בימי התשלומין הקהל פוחת אט אט: 💡 הערכים הם הצעה.\\\"),\\n          flow:I(\\\"זרם הקהל במועד\\\",\\\"יחזקאל מו, ט; מלבי״ם מו, ט-י\\\",\\\"📜 \\\\\\\"הבא דרך שער צפון להשתחות יצא דרך שער נגב... לא ישוב דרך השער אשר בא בו\\\\\\\". ⚖️ המלבי״ם: כך נעשה \\\\\\\"לכבוד העם\\\\\\\". במודל שני זרמים, מצפון לדרום ומדרום לצפון. השער המזרחי סגור. 💡 מסלול ההליכה ומספר ההולכים הם הצעה לתצוגה.\\\"),\\n          sleep:I(\\\"עיר המעמד: לנים ברחוב\\\",\\\"ביכורים ג, ב\\\",\\\"📜 מביאי הביכורים מתכנסים לעיר המעמד, לנים ברחובה של עיר, והממונה אומר להם: קומו ונעלה ציון אל ה׳ אלהינו. \\\"+NV+\\\"💡 מקום עיר המעמד, מספר הישנים והממונה הם הצעה לתצוגה.\\\"),\\n          green:I(\\\"ירק ופרחים בשערים החיצוניים\\\",\\\"💡 הצעה, ללא מקור\\\",\\\"💡 הצעה, ללא מקור. עיטור ירק ופרחים מוצג רק בשערים החיצוניים של החצר החיצונה, ולא על המזבח ולא בהיכל. מוצג בערב שבועות, בו׳ בסיוון ובימי התשלומין.\\\"),\\n          olim:I(\\\"עולות ראייה בחצר הפנימית\\\",\\\"חגיגה א, א; חגיגה יז ע״א; רמב״ם, הלכות חגיגה א, ז\\\",\\\"📜 עולות הראייה ושלמי החגיגה מוקרבים ברגל, ולשבועות שבעה ימים בסך הכול: יום החג וששת הימים שלאחריו. ⚖️ רמב״ם, חגיגה א, ז: «ויש לו תשלומין כל ששת ימים שלאחר חג השבועות». הדף בגמרא לא נבדק במסגרת בדיקת המשנה והרמב״ם. מוצג בו׳ בסיוון ובימי התשלומין. 💡 מספר המביאים ומקומם הם הצעה לתצוגה.\\\"),\\n          cook:I(\\\"שלמי החגיגה בבית המבשלים\\\",\\\"יחזקאל מו, כא-כד; מלבי״ם מו, כד; חגיגה יז ע״א\\\",\\\"📜 \\\\\\\"יבשלו שם משרתי הבית את זבח העם\\\\\\\" (יחזקאל מו, כד). ⚖️ המלבי״ם: מבשלים שם שלמים ותודה. בימי התשלומין ממשיכים להביא שלמי חגיגה. 💡 מספר המשרתים והסירים הוא הצעה לתצוגה.\\\")};\\n\"\n}"
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          import os
          c=json.loads(os.environ['SHAVUOT_CARDS'])
          p=pathlib.Path('src/main/40-temple-build.js');s=p.read_text()
          assert s.count(c['old'])==1
          p.write_text(s.replace(c['old'],c['new'],1))
          subprocess.run(['python3','tools/templesrc.py','build'],check=True)
          subprocess.run(['python3','tools/templesrc.py','check'],check=True)
          PYCODE
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/reading-dump.js http://localhost:8765/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/shavuot-sources.yml
          git add src/main/40-temple-build.js index.html tours/reading.json
          git commit -m 'Ground matching Shavuot scene cards; preserve geometry and narration'
          git push origin HEAD:instinct/shavuot-sources-20261119

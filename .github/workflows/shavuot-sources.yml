name: Build Shavuot source-note corrections
on:
  push:
    branches: [instinct/shavuot-sources-20261119]
    paths: [.github/workflows/shavuot-sources.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          SHAVUOT_CHANGES: "{\"1\": {\"old\": \"📜 הכפרים שבמעמד מתכנסים לעיר המעמד, לנים ברחובה של עיר, והממונה אומר: \\\"קומו ונעלה ציון אל בית ה׳ אלהינו\\\" (ביכורים ג, ב; הנוסח לא נבדק מול נוסח נקי). 💡 מקום עיר המעמד הוא הצעה לתצוגה, וכך מספר הישנים.\", \"new\": \"📜 הכפרים שבמעמד מתכנסים לעיר המעמד, לנים ברחובה של עיר, והממונה אומר: \\\"קומו ונעלה ציון אל ה׳ אלהינו\\\" (ביכורים ג, ב). 💡 מקום עיר המעמד הוא הצעה לתצוגה, וכך מספר הישנים.\"}, \"2\": {\"old\": \"📜 \\\"השור הולך לפניהם, וקרניו מצופות זהב ועטרה של זית בראשו, החליל מכה לפניהם עד שמגיעים קרוב לירושלים\\\" (ביכורים ג, ג; הנוסח לא נבדק מול נוסח נקי). 💡 גודל השור והחליל הם הצעה לתצוגה.\", \"new\": \"📜 \\\"השור הולך לפניהם, וקרניו מצופות זהב ועטרה של זית בראשו, החליל מכה לפניהם עד שמגיעים קרוב לירושלים\\\" (ביכורים ג, ג). 💡 גודל השור והחליל הם הצעה לתצוגה.\"}, \"3\": {\"old\": \"📜 \\\"כל בעלי אומניות שבירושלים עומדים מפניהם ושואלים בשלומם: אחינו אנשי המקום פלוני, באתם לשלום\\\" (ביכורים ג, ג; הנוסח לא נבדק מול נוסח נקי). 💡 מספר העומדים ולבושם הם הצעה לתצוגה.\", \"new\": \"📜 \\\"כל בעלי אומניות שבירושלים עומדים לפניהם ושואלים בשלומם: אחינו אנשי מקום פלוני, באתם לשלום\\\" (ביכורים ג, ג). 💡 מספר העומדים ולבושם הם הצעה לתצוגה.\"}, \"4\": {\"old\": \"📜 \\\"הגיעו להר הבית, אפילו אגריפס המלך נוטל הסל על כתפו ונכנס\\\" (ביכורים ג, ד; הנוסח לא נבדק מול נוסח נקי). 💡 קצב ההרמה הוא הצעה לתצוגה.\", \"new\": \"📜 \\\"הגיעו להר הבית, אפילו אגריפס המלך נוטל הסל על כתפו ונכנס\\\" (ביכורים ג, ד). 💡 קצב ההרמה הוא הצעה לתצוגה.\"}, \"6\": {\"old\": \"📜 \\\"והכהן מניח ידו תחתיו ומניפו, וקורא... ומניחו בצד המזבח\\\" (ביכורים ג, ו; הנוסח לא נבדק מול נוסח נקי). 💡 מקום הערימה בצד הצפוני של המזבח הוא הצעה לתצוגה.\", \"new\": \"📜 \\\"וכהן מניח ידו תחתיו ומניפו, וקורא... ומניחו בצד המזבח\\\" (ביכורים ג, ו). ⚖️ המשנה אומרת «בצד המזבח»; רמב״ם, הלכות ביכורים ג, יב, מפרט: «בקרן דרומית מערבית בדרומה של קרן». 💡 הערימה בדגם נמצאת בצד הצפוני: זו אי־התאמה למיקום המתואר ברמב״ם, ולא קביעה הלכתית. הגאומטריה לא שונתה בבדיקת המקורות.\"}, \"7\": {\"old\": \"⚖️ שתי הלחם אינן חלק מהבאת הביכורים: הן קרבן הציבור של חג השבועות עצמו (ויקרא כג, טז–כ), וקרבות פעם אחת בחג. את הביכורים מביא כל אחד בנפרד, משבועות ועד חנוכה, בסדר שבמשנה ביכורים ג, ב–ו. הסיור מראה את שניהם, אבל הם שני דברים. 📜 \\\"נותן שתי הלחם על שני כבשים, מניח שתי ידיו מלמטן, מוליך ומביא, מעלה ומוריד\\\" (מנחות ה, ו). 📜 \\\"שתי הלחם אורכן שבעה, ורוחבן ארבעה, וקרנותיה ארבע אצבעות\\\" (מנחות יא, ד). ⚖️ רמב״ם, תמידין ומוספין ח, יא: \\\"מביא שני הכבשים, ומניף אותם כשהם חיים\\\". הרמב״ם מתאר תנופה בשני שלבים: הכבשים חיים, ואחר השחיטה שתי הלחם עם החזה והשוק; במשנה שתי הלחם נתונות על הכבשים. המודל מציג את נוסח המשנה. 💡 המקום «במזרח» נקבע לפי הטבלה של המשימה, ולא נבדק מול נוסח נקי.\", \"new\": \"⚖️ שתי הלחם אינן חלק מהבאת הביכורים: הן קרבן הציבור של חג השבועות עצמו (ויקרא כג, טז–כ), וקרבות פעם אחת בחג. את הביכורים מביא כל אחד בנפרד, משבועות ועד חנוכה (ביכורים א, ו; א, י), בסדר שבמשנה ביכורים ג, ב–ו. הסיור מראה את שניהם, אבל הם שני דברים. 📜 \\\"נותן שתי הלחם על גבי שני כבשים, מניח שתי ידיו מלמטן, מוליך ומביא, מעלה ומוריד\\\" (מנחות ה, ו). 📜 \\\"שתי הלחם אורכן שבעה, ורוחבן ארבעה, וקרנותיה ארבע אצבעות\\\" (מנחות יא, ד). ⚖️ רמב״ם, תמידין ומוספין ח, יא: \\\"מביא שני הכבשים, ומניף אותם כשהם חיים\\\". הרמב״ם מתאר תנופה בשני שלבים: הכבשים חיים, ואחר השחיטה שתי הלחם עם החזה והשוק; במשנה שתי הלחם נתונות על הכבשים. המודל מציג את נוסח המשנה. 📜 «תנופה היתה במזרח» נאמר במפורש במשנה מנחות ה, ו; וכן ברמב״ם, תמידין ומוספין ח, יא: «ומניף הכל כאחד במזרח במקום כל התנופות». 💡 המיקום בדגם אינו ראיה למידת הדיוק של הגאומטריה. לא הוכרעה כאן המחלוקת על אופן הצגת הלחם והכבשים.\"}}"
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          import os
          changes=json.loads(os.environ['SHAVUOT_CHANGES'])
          p=pathlib.Path('src/main/62-tours-ui.js');s=p.read_text()
          for c in changes.values():
              old=json.dumps(c['old'],ensure_ascii=False);new=json.dumps(c['new'],ensure_ascii=False)
              assert s.count(old)==1,old[:50]
              s=s.replace(old,new,1)
          p.write_text(s)
          subprocess.run(['python3','tools/templesrc.py','build'],check=True)
          subprocess.run(['python3','tools/templesrc.py','check'],check=True)
          PYCODE
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tools/test/reading-dump.js http://localhost:8765/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/shavuot-sources.yml .github/workflows/.github/workflows/shavuot-sources.yml
          git add src/main/62-tours-ui.js index.html tours/reading.json
          git commit -m 'Ground Shavuot source notes in Mishnah and Rambam; preserve captions'
          git push origin HEAD:instinct/shavuot-sources-20261119

      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PYCODE'
          import base64,subprocess
          subprocess.run(['git','apply','-'],input=base64.b64decode(''),check=True)
          PYCODE
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          rm .github/workflows/instinct-siloam-prepare.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

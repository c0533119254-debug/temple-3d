name: Rebase approved audio branch
on:
  push:
    branches: [instinct/audio-v2-integration-20261118]
    paths: [.github/workflows/audio-rebase.yml]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse origin/main)" = 783a2677c3dee6861c32d4fc02d64abfd45bdbb0
          old=$(git rev-parse HEAD)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rebase origin/main
          git push --force-with-lease=refs/heads/instinct/audio-v2-integration-20261118:$old origin HEAD:instinct/audio-v2-integration-20261118

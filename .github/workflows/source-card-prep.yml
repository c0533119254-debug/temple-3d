name: Prepare tour source card fix
on:
  push:
    paths: ['.github/workflows/source-card-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source card patch and rebuild
        env:
          PATCH: 
        run: |
          printf '%s' "$PATCH" | base64 -d > /tmp/source-card.patch
          git apply /tmp/source-card.patch
          python3 tools/templesrc.py build
          python3 tools/templesrc.py check
          node --check tools/test/user-path.js
          rm .github/workflows/source-card-prep.yml .github/workflows/.github/workflows/source-card-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/main/32-story-tours.js src/page/10-page-top.html tools/test/user-path.js .github/workflows/source-card-prep.yml
          git commit -m 'Show requested tour source card without covering tour controls'
          git push
